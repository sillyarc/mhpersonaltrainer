[package]
name = "mh-personal-web"
version = "1.0.0"
description = "MH Personal Trainer Desktop"
authors = ["Nagazaki Software"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "icon-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
